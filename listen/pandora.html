<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pandora Window - Hawkins Music</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#111;color:#fff;font-family:Helvetica,Arial,sans-serif}
#bar{background:#1c1c1e;padding:10px 12px;font-size:17px}
#bar a{color:#ff8a3d;text-decoration:none;font-weight:bold;margin-right:16px}
#bar button{background:#2c2c2e;color:#fff;border:1px solid #555;border-radius:8px;font-size:16px;padding:6px 10px}
#help{display:none;background:#222;border-top:1px solid #444;padding:12px;font-size:16px;line-height:1.4;color:#ddd}
#help a{color:#ff8a3d}
#frameWrap{height:calc(100% - 46px);background:#000}
#frameWrap iframe{width:100%;height:100%;border:0;display:block;background:#000}
</style>
</head>
<body>
<div id="bar">
<a href="/listen/">&#8592; Music</a>
<button type="button" onclick="showHelp()">Window blank?</button>
</div>
<div id="help">
If the window below is blank, Pandora is blocking it from playing inside another site. Tap <a href="https://www.pandora.com" target="_blank">Open in full browser window</a> &mdash; that is still a browser window, not the app. On an iPad, also try Safari &gt; Share &gt; Request Desktop Website, then reload this page.
</div>
<div id="frameWrap">
<iframe src="https://www.pandora.com" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
</div>
<script>
function showHelp() {
  var h = document.getElementById("help");
  if (h.style.display === "block") { h.style.display = "none"; }
  else { h.style.display = "block"; }
}
</script>
</body>
</html>
